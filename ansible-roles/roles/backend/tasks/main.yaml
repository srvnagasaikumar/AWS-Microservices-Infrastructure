---
- name: Install required Node.js runtime and dependencies
  ansible.builtin.dnf:
    name:
      - nodejs
      - npm
      - mysql
    state: present

- name: Create dedicated application user
  ansible.builtin.user:
    name: myapp
    shell: /sbin/nologin
    create_home: false

- name: Ensure application directory exists
  ansible.builtin.file:
    path: /app
    state: directory
    owner: myapp
    group: myapp
    mode: '0755'

- name: Download application artifacts
  ansible.builtin.unarchive:
    src: https://myapp-builds.s3.us-east-1.amazonaws.com/backend.zip
    dest: /app
    remote_src: true
    owner: myapp
    group: myapp

- name: Install NPM dependencies
  community.general.npm:
    path: /app
    state: present

- name: Deploy systemd service unit file
  ansible.builtin.template:
    src: backend.service.j2
    dest: /etc/systemd/system/backend.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart Backend Service

- name: Enable and start backend service
  ansible.builtin.systemd:
    name: backend
    state: started
    enabled: true
    daemon_reload: true